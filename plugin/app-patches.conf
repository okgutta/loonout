# 本仓库补丁：上游 SunsetMkt/anti-ip-attribution 没收录、抓包核对后补的规则。
# 由 scripts/sync-anti-ip-rules.ps1 追加到插件里所有上游分组之后。
# 维护约定：只加「业务接口」域名；CDN / 静态资源不要加，否则视频图片会走代理变慢。
# 宽泛关键词（-normal-）必须放最后：放前面会抢走其它 App 的流量。
# 每条规则的实测过程、以及「为什么不加某条」，见 docs/ip-attribution-notes.md。

# --- 抖音 --- 2026-09-21
# 上游只收了 -lq / -hl / -lf 关键词，实际主机名是 life5-normal-m-hl（多 -m-）、
# webcast5-core-hl（少 -c），一条都匹配不上；视频/图片 CDN 不在 amemv.com 下。
DOMAIN-KEYWORD,-normal-,PROXY
DOMAIN-SUFFIX,amemv.com,PROXY

