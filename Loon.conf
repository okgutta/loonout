[Plugin]
# 默认关闭。需要按 App 学习并导出 IP/域名分流规则时，在 Loon 中启用并设置参数。
https://raw.githubusercontent.com/okgutta/loonout/v1.1.0/Loon-App-IP-Router-Easy.plugin,tag=App IP Router 简易版,policy=全球代理,enabled=false

# 本配置不默认启用 MITM、Rewrite 或第三方脚本，也不包含证书和私密节点信息。
