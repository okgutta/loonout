[MITM]
# Every plugin above declares its own MitM hostnames; Loon merges them automatically.
# Install the Loon CA on the device and trust it under Settings > General > About > Certificate Trust Settings.
# Bilibili/YouTube ad filters also require "MitM over HTTP/2" in Loon's MitM settings.
# Do not commit ca-p12/ca-passphrase here: this file is public and ca-p12 contains the CA private key.
hostname = api.xunjiapp.cn
skip-server-cert-verify = false
